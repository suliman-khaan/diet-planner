name: CI

on:
  push:
    branches: [main, development, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Food pack (schema, validator, build in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validator tests
        working-directory: tools/food-pack
        run: npm test
      - name: Rebuild pack and check it matches the committed copy
        run: |
          node tools/food-pack/build.js content/pakistan apps/mobile/assets/packs/pk-core.json
          git diff --exit-code -- apps/mobile/assets/packs/pk-core.json
      - name: Validate pack
        run: node tools/food-pack/validate.js apps/mobile/assets/packs/pk-core.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    name: Mobile (format, analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - name: Flutter version
        run: flutter --version
      - name: Packages
        run: flutter pub get
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: apps/mobile/pubspec.lock
          retention-days: 7
      - name: Code generation (Drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze (warnings are errors)
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test --coverage --reporter expanded
      - name: Domain coverage ≥ 90%
        run: |
          awk -F: '
            /^SF:/ { inDomain = ($2 ~ /lib\/domain\//) }
            inDomain && /^LF:/ { lf += $2 }
            inDomain && /^LH:/ { lh += $2 }
            END {
              if (lf == 0) { print "No domain lines found"; exit 1 }
              pct = 100 * lh / lf
              printf "Domain line coverage: %.1f%% (%d/%d)\n", pct, lh, lf
              if (pct < 90) exit 1
            }' coverage/lcov.info
      - name: Build dev APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
      - name: Build prod release APK (arm64, obfuscated)
        run: |
          flutter build apk --release --flavor prod -t lib/main.dart \
            --target-platform android-arm64 --split-per-abi \
            --obfuscate --split-debug-info=build/symbols
      - name: Release size budget (≤ 25 MB)
        run: |
          apk=$(ls build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          size=$(stat -c%s "$apk")
          echo "arm64 release APK: $apk = $((size / 1024 / 1024)) MB ($size bytes)"
          echo "### arm64 release APK size: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le 26214400
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/*arm64*release*.apk
          retention-days: 14
