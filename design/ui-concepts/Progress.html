<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6A50}a:hover{color:#134A38}
</style>
</head>
<body style="margin:0; display:flex; justify-content:center; background:#DDDBD3">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16201B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; overflow: hidden; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">Progress</h1>
      <div role="tablist" aria-label="Range" style="display: flex; background: #EDEBE4; border-radius: 12px; padding: 3px">
        <button role="tab" aria-selected="false" style="height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #3E4A44">Week</button>
        <button role="tab" aria-selected="true" style="height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; color: #16201B; box-shadow: 0 1px 3px rgba(22,32,27,0.15)">Month</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #56635C">Weight</span>
          <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.8px">78.4 <span style="font-size: 16px; font-weight: 600; color: #56635C">kg</span></span>
          <span style="font-size: 13px; font-weight: 600; color: #3E4A44">1.6 kg down in 4 weeks</span>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #1D6A50; background: #FFFFFF; color: #1D6A50; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Add weight</button>
      </div>
      <svg width="324" height="120" viewBox="0 0 324 120" role="img" aria-label="Weight trend over 4 weeks, from 80.0 to 78.4 kg">
        <path d="M0 30H324M0 70H324M0 110H324" stroke="#EDEBE4" stroke-width="1"></path>
        <path d="M6 22 L52 30 L98 38 L144 36 L190 52 L236 62 L282 70 L318 80" fill="none" stroke="#1D6A50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="6" cy="22" r="4" fill="#1D6A50"></circle>
        <circle cx="98" cy="38" r="4" fill="#1D6A50"></circle>
        <circle cx="190" cy="52" r="4" fill="#1D6A50"></circle>
        <circle cx="282" cy="70" r="4" fill="#1D6A50"></circle>
        <circle cx="318" cy="80" r="5" fill="#FFFFFF" stroke="#1D6A50" stroke-width="3"></circle>
      </svg>
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #56635C">
        <span>30 Sep</span><span>7 Oct</span><span>14 Oct</span><span>21 Oct</span><span>28 Oct</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">This week's eating</h2>
        <span style="font-size: 12px; color: #56635C">kcal · estimates</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px">
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 82%; border-radius: 8px; background: #1D6A50"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 90%; border-radius: 8px; background: #1D6A50"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 100%; box-sizing: border-box; border-radius: 8px; border: 2px dashed #B9B6AA"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 76%; border-radius: 8px; background: #1D6A50"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 48%; border-radius: 8px; background: #9CC7B4"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 95%; border-radius: 8px; background: #1D6A50"></div></div>
        <div style="display: flex; flex-direction: column; justify-content: flex-end; height: 100%"><div style="height: 60%; border-radius: 8px; background: #9CC7B4"></div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 12px; font-weight: 600; color: #56635C">
        <span>W</span><span>T</span><span>F</span><span>S</span><span>S</span><span>M</span><span>T</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #3E4A44">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1D6A50"></span>Fully logged</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #9CC7B4"></span>Partly logged</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; box-sizing: border-box; border: 2px dashed #B9B6AA"></span>Not logged</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #56635C">Days logged</span>
        <span style="font-size: 20px; font-weight: 800">6 <span style="font-size: 14px; font-weight: 600; color: #56635C">of 7</span></span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #56635C">Avg. protein</span>
        <span style="font-size: 20px; font-weight: 800">71 <span style="font-size: 14px; font-weight: 600; color: #56635C">g / day</span></span>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="height: 72px; flex: none; background: #FFFFFF; border-top: 1px solid #E4E2DA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635C; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span>Today</a>
    <a href="Foods.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635C; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>Foods</a>
    <a href="Progress.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1D6A50; font-size: 12px; font-weight: 700">
      <span style="width: 56px; height: 28px; border-radius: 14px; background: #E2EFE8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"></path><path d="M5 15l4-4 4 3 6-7"></path></svg></span>Progress</a>
    <a href="#more" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56635C; font-size: 12px; font-weight: 600">
      <span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></span>More</a>
  </nav>
</div>
</body>
</html>
