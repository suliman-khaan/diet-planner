<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: cooking richness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6A50}a:hover{color:#134A38}
</style>
</head>
<body style="margin:0; display:flex; justify-content:center; background:#DDDBD3">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #16201B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 24px">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div role="progressbar" aria-label="Step 6 of 8" aria-valuemin="1" aria-valuemax="8" aria-valuenow="6" style="flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #1D6A50"></span>
      <span style="height: 4px; border-radius: 2px; background: #DAD7CD"></span>
      <span style="height: 4px; border-radius: 2px; background: #DAD7CD"></span>
    </div>
    <span style="font-size: 13px; font-weight: 600; color: #56635C; width: 44px; text-align: end">6 / 8</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px">
    <h1 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 800; letter-spacing: -0.4px">How rich is your home cooking?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #56635C">Oil and ghee add more calories than most people expect. Pick what's closest to your usual salan.</p>
  </div>

  <fieldset style="border: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cooking richness</legend>

    <label style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer">
      <input type="radio" name="rich" value="light" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #1D6A50">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 700">Light</span>
        <span style="font-size: 14px; line-height: 1.45; color: #56635C">Little oil on top. Daal and sabzi look dry-ish.</span>
        <span style="font-size: 13px; font-weight: 600; color: #1D6A50">About 1 tsp oil per katori</span>
      </span>
    </label>

    <label style="background: #E2EFE8; border: 2px solid #1D6A50; border-radius: 18px; padding: 15px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer">
      <input type="radio" name="rich" value="normal" checked style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #1D6A50">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 700">Normal <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1D6A50; padding: 2px 8px; border-radius: 999px; margin-inline-start: 4px">Most common</span></span>
        <span style="font-size: 14px; line-height: 1.45; color: #3E4A44">A thin layer of oil shows on the salan.</span>
        <span style="font-size: 13px; font-weight: 600; color: #1D6A50">About 2 tsp oil per katori</span>
      </span>
    </label>

    <label style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer">
      <input type="radio" name="rich" value="rich" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #1D6A50">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 700">Rich</span>
        <span style="font-size: 14px; line-height: 1.45; color: #56635C">Oil floats on top, like karahi or shadi-style food.</span>
        <span style="font-size: 13px; font-weight: 600; color: #1D6A50">About 4 tsp oil per katori</span>
      </span>
    </label>
  </fieldset>

  <div style="margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E4E2DA">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56635C" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.5"></path></svg>
    <span style="font-size: 13px; line-height: 1.45; color: #56635C">You can change this for any single dish later. All values are estimates.</span>
  </div>

  <div style="flex: 1"></div>

  <button style="height: 56px; border-radius: 16px; border: none; background: #1D6A50; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Continue</button>
</div>
</body>
</html>
